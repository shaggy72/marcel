<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Marcels spullen</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; font-family: system-ui, sans-serif; color:#23311f;
         background: linear-gradient(160deg, #e9f3dc 0%, #cfe7b8 100%);
         display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px; padding:24px; }
  h1 { margin:0; font-size:38px; text-align:center; }
  p { margin:0; font-size:18px; color:#4a5b45; text-align:center; }
  .keuzes { display:grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap:18px; width:100%; max-width:640px; }
  a.keuze { display:block; text-decoration:none; color:#fff; border-radius:24px; padding:26px 22px; box-shadow:0 8px 20px #0003;
            transition: translate .15s; }
  a.keuze:active { translate: 0 3px; }
  a.keuze .icoon { font-size:64px; line-height:1; }
  a.keuze b { display:block; font-size:26px; margin-top:12px; }
  a.keuze span { display:block; font-size:16px; opacity:.9; margin-top:4px; }
  .kamp { background: linear-gradient(140deg, #2f6b3a, #4f9a3f); }
  .race { background: linear-gradient(140deg, #d35400, #f39c12); }
</style>
</head>
<body>
  <h1>Hoi Marcel! 👋</h1>
  <p>Wat wil je doen?</p>
  <div class="keuzes">
    <a class="keuze kamp" href="kampbouwer.html">
      <div class="icoon">🏕️</div>
      <b>Kampbouwer</b>
      <span>Knopen leren en je kamp ontwerpen</span>
    </a>
    <a class="keuze race" href="race.html">
      <div class="icoon">🏎️</div>
      <b>Marcels Race</b>
      <span>Racen op 6 circuits</span>
    </a>
  </div>
</body>
</html>
